name: RD03v2 validation

on:
  push:
    branches:
      - work/rd03v2-dualwan-mwan3-baseline
    # Documentation-only edits do not need a firmware source/configuration preflight.
    # Mixed documentation + source changes still run because not every changed path is ignored.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: rd03v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    name: Static checks (no firmware build)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace and merge-base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --check origin/main...HEAD -- . ':(exclude,glob)**/*.patch'
          git merge-base --is-ancestor origin/main HEAD

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
            echo "PASS bash -n $file"
          done < <(find . -type f -name '*.sh' -not -path './openwrt-v2/*' -print0)

      - name: Compile-check Python tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          echo "PASS Python syntax: tools/"

      - name: Test PREPARE_ONLY signing-key resume safely
        shell: bash
        run: |
          set -euo pipefail
          bash tools/test-install-v2-signing-key.sh

      - name: Check RD03v2 NSS Kconfig cycle guard
        shell: bash
        run: |
          set -euo pipefail
          patch=tree-patches/0014-luci-app-nss-use-ipq50xx-runtime-dependency-only.patch
          test -s "$patch"
          grep -qxF '+LUCI_DEPENDS:=+luci-base +nss-tools-dwmac' "$patch"
          if grep -q '^+.*+!TARGET_qualcommax_ipq50xx:nss-tools' "$patch"; then
            echo "::error::The legacy nss-tools fallback was reintroduced."
            exit 1
          fi
          echo "PASS: RD03v2 selects only the DWMAC-specific NSS runtime helper"

      - name: Validate RD03v2 config and package manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          config = Path("config/rd03v2.config").read_text()
          manifest = [
              line.strip()
              for line in Path("config/image-must-have.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]

          devices = re.findall(r"^CONFIG_TARGET_DEVICE_.*=y$", config, re.M)
          if len(devices) != 1 or "xiaomi_mi-router-ax3000t-v2" not in devices[0]:
              sys.exit(f"FAIL: expected exactly one RD03v2 target, got {devices}")

          required_config = [
              "CONFIG_IPV6=y",
              "CONFIG_PACKAGE_mwan3=y",
              "CONFIG_PACKAGE_luci-app-mwan3=y",
              "CONFIG_PACKAGE_iptables-nft=y",
              "CONFIG_PACKAGE_ip6tables-nft=y",
              "CONFIG_PACKAGE_xtables-nft=y",
              "CONFIG_PACKAGE_ipset=y",
              "CONFIG_ATH11K_NSS_MEM_PROFILE_256M=y",
          ]
          config_lines = config.splitlines()
          missing = [item for item in required_config if item not in config_lines]
          if missing:
              sys.exit(f"FAIL: missing config entries: {missing}")

          upstream_profile_choices = [
              "CONFIG_ATH11K_MEM_PROFILE_256M=y",
              "CONFIG_NSS_MEM_PROFILE_LOW=y",
          ]
          duplicated_profiles = [item for item in upstream_profile_choices if item in config_lines]
          if duplicated_profiles:
              sys.exit(
                  "FAIL: 256 MiB choice symbols must come only from upstream "
                  f".github/ci/ipq50xx/256m.config, not config/rd03v2.config: {duplicated_profiles}"
              )

          duplicates = sorted({item for item in manifest if manifest.count(item) > 1})
          if duplicates:
              sys.exit(f"FAIL: duplicate image manifest entries: {duplicates}")

          required_packages = [
              "mwan3", "luci-app-mwan3", "iptables-nft", "ip6tables-nft",
              "xtables-nft", "ipset", "iptables-mod-conntrack-extra",
              "iptables-mod-ipopt"
          ]
          missing_packages = [item for item in required_packages if item not in manifest]
          if missing_packages:
              sys.exit(f"FAIL: missing image manifest entries: {missing_packages}")

          if "must not be copied into v2" not in Path("docs/dualwan.md").read_text():
              sys.exit("FAIL: Dual-WAN documentation must state that the v1 ECM patch is not in v2")

          print("PASS: one RD03v2 target")
          print(f"PASS: {len(required_config)} local Kconfig requirements")
          print("PASS: upstream 256 MiB host/NSS profile choices are not duplicated locally")
          print(f"PASS: {len(required_packages)} required Dual-WAN packages")
          print("PASS: no duplicate image manifest entries")
          PY

      - name: Check that no private signing key is tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)private-key\.pem$'; then
            echo "::error::A private signing key must never be committed."
            exit 1
          fi
          echo "PASS: no tracked private-key.pem"

  prepare-only:
    name: Prepare pinned sources, feeds and defconfig (no signing key)
    needs: static-validation
    if: needs.static-validation.result == 'success' && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenWrt build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libelf-dev libncurses-dev libssl-dev python3 python3-setuptools rsync swig time unzip wget xsltproc zlib1g-dev file zstd

      - name: Prepare pinned sources, feeds and final Kconfig
        shell: bash
        env:
          TAG: PREPARE-${{ github.sha }}
          JOBS: "2"
          PREPARE_ONLY: "1"
          V2_REPO_URL: https://example.invalid/rd03v2-ci/packages.adb
        run: |
          set -euo pipefail
          ./build.sh
          # GitHub artifact upload excludes dotfiles by default; copy final Kconfig to a visible name.
          cp openwrt-v2/.config openwrt-v2/config.final.txt

      - name: Preflight ECM FIB-rule patch against pinned QSDK source
        shell: bash
        run: |
          set -euo pipefail
          bash ./tools/test-ecm-fib-rule-patch.sh

      - name: Upload preparation logs and config only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd03v2-prepare-${{ github.sha }}
          path: |
            openwrt-v2/feeds-update.log
            openwrt-v2/feeds-install.log
            openwrt-v2/defconfig.log
            openwrt-v2/config.final.txt
            openwrt-v2/diffconfig.txt
            openwrt-v2/tmp/.config-package.in
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

  full-build:
    name: Full signed-image build and verify-v2
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[full-build]')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show runner resources
        shell: bash
        run: |
          free -h
          df -h "$GITHUB_WORKSPACE"
          nproc

      - name: Generate temporary CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          keydir="$(dirname "$GITHUB_WORKSPACE")/keys/v2"
          mkdir -p "$keydir"
          umask 077
          openssl ecparam -name prime256v1 -genkey -noout -out "$keydir/private-key.pem"
          chmod 600 "$keydir/private-key.pem"
          openssl ec -in "$keydir/private-key.pem" -pubout -out "$keydir/public-key.pem" 2>/dev/null
          # Override only this disposable runner checkout. The committed public key is untouched.
          cp "$keydir/public-key.pem" "$GITHUB_WORKSPACE/keys/public-key.pem"
          openssl ec -in "$keydir/private-key.pem" -pubout 2>/dev/null | cmp -s - "$GITHUB_WORKSPACE/keys/public-key.pem"
          echo "PASS: temporary P-256 keypair matches in the runner workspace"

      - name: Install image verification host tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-user device-tree-compiler

      - name: Build and run verify-v2
        shell: bash
        env:
          JOBS: "2"
          TAG: CI-${{ github.sha }}
          V2_REPO_URL: https://example.invalid/rd03v2-ci/packages.adb
        run: |
          set -euo pipefail
          ./build.sh

      - name: Upload build logs only (never publish CI images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rd03v2-build-logs-${{ github.sha }}
          path: |
            openwrt-v2/*.log
            openwrt-v2/diffconfig.txt
            openwrt-v2/watchdog-*-tests.log
          if-no-files-found: warn
          retention-days: 14
